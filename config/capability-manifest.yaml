project_shapes:
  recovery_required:
    guard_status: run-recover
    migrate_allowed: false
    message: This project is in a recoverable SweetClaude migration/update state. Run /sweetclaude:recover
      before any taxonomy migration.
    recovery_route: stabilize-without-migration
    recovery_capability: recover.stabilize_without_migration
  manual_escalation:
    guard_status: manual-review
    migrate_allowed: false
    message: This project needs manual SweetClaude recovery review before migration or other maintenance
      commands.
    doctor_capability: doctor.manual_review
  accepted_legacy_taxonomy:
    guard_status: compatibility-mode
    migrate_allowed: true
    message: This project has a legacy taxonomy layout. Run /sweetclaude:migrate to convert to v4, or
      /sweetclaude:recover to check graduation eligibility.
    migration_capability: migrate.typed_legacy_backlog
    graduation_capability: recover.graduate_from_compatibility
  graduation_candidate:
    guard_status: graduation-available
    migrate_allowed: false
    message: This project is v4-compliant and can graduate from compatibility mode.
    graduation_capability: recover.graduate_from_compatibility
  graduation_blocked:
    guard_status: graduation-blocked
    migrate_allowed: false
    message: This project could graduate from compatibility mode, but validation blockers must be fixed
      first. Each blocker carries its resolution.
    blocker_fix_capability: doctor.fix_graduation_blockers
    graduation_capability: recover.graduate_from_compatibility
  flat_bl_backlog:
    migration: flat_bl_to_issue
    guard_status: migration-may-be-needed
    migrate_allowed: true
    message: Old-format work items were found and no recovery-only state was detected. Review /sweetclaude:migrate
      before executing it.
    migration_capability: migrate.flat_bl_to_issue
  typed_legacy_backlog:
    guard_status: supported-migration-available
    migrate_allowed: true
    migration_capability: migrate.typed_legacy_backlog
    message: This project has a typed legacy backlog layout. Run /sweetclaude:migrate to migrate to the
      unified ISSUE-NNN taxonomy.
  missing_product_base:
    guard_status: missing-product-base
    migrate_allowed: false
    message: SweetClaude product artifacts were not found. Run /sweetclaude:doctor or /sweetclaude:setup
      instead of migration.
    doctor_capability: doctor.manual_review
  current_layout:
    guard_status: ok
    migrate_allowed: false
    message: No SweetClaude migration or recovery guard is currently active.
