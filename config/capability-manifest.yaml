schema_version: 1
channels:
  stable:
    branch: main
    major_version: 4
    expected_marketplace: sweetclaude-stable
    prerelease_required: false
    prerelease_allowed: false
    control_lint_required: true
  beta:
    branch: beta-4.x
    major_version: 4
    expected_marketplace: sweetclaude-beta
    prerelease_required: true
    prerelease_allowed: true
    minimum_safe_version: 4.1.9-beta
    retired: true
    retirement_target_channel: stable
    control_lint_required: true
  legacy:
    branch: stable-3.x
    major_version: 3
    expected_marketplace: sweetclaude-legacy
    prerelease_required: false
    prerelease_allowed: false
release:
  required_evidence_checks:
  - tests
  - channel-isolation
  - installation-smoke
  - static-checks
  - release-metadata
  - manifest-validation
  - release-identity
  - docs-capability
  - public-distribution
capabilities:
  recover.stabilize_without_migration:
    title: Stabilize recoverable legacy layout without taxonomy migration
    delegate_skill: sweetclaude:recover
    command_entrypoint:
      slash_command: /sweetclaude:recover
      script: scripts/recovery/recover_project.py
      module: recovery.recover_project
    supports_project_shapes:
    - recovery_required
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
    - project guard status is run-recover
    - recovery plan exists before execute
    snapshot_scope_hints:
    - .sweetclaude/
    - docs/product/
    postconditions:
    - id: recovery-postconditions
      check: recovery verifier reports stabilized state
    rollback_support:
      supported: true
      command: python3 scripts/recovery/recover_project.py rollback --project-dir <project>
      limitations: []
    unsupported_states:
    - condition: manual_escalation
      behavior: escalate
    - condition: missing_product_base
      behavior: diagnose_only
    version_metadata:
      introduced_in: 4.1.0-beta
      deprecated_in: null
    safety_contract:
    - diagnose
    - plan
    - snapshot
    - verify-snapshot
    - approve
    - execute
    - record-progress
    - resume
    - verify-postconditions
    - rollback
    verification_commands:
    - python3 scripts/recovery/recover_project.py diagnose --project-dir <project>
    - python3 scripts/recovery/recover_project.py plan --project-dir <project>
  migrate.flat_bl_to_issue:
    title: Migrate flat BL-NNN backlog to ISSUE taxonomy
    delegate_skill: sweetclaude:migrate
    executable: scripts/migrate/migrate-v3-to-v4.py
    command_entrypoint:
      slash_command: /sweetclaude:migrate
      script: scripts/migrate/migrate-v3-to-v4.py
      module: null
    supports_project_shapes:
    - flat_bl_backlog
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    preflight_required: true
    required_preconditions:
    - project shape is flat_bl_backlog
    - migration preflight passes
    - user approval is bound to current plan
    snapshot_scope_hints:
    - .sweetclaude/product/backlog/
    - .sweetclaude/state/
    postconditions:
    - id: issue-taxonomy-created
      check: migrated ISSUE files and migration map exist
    - id: migration-integrity
      check: execution manifest contains source and created file integrity
    rollback_support:
      supported: true
      command: python3 scripts/migrations/run_rollback.py --project-dir <project>
      limitations: []
    unsupported_states:
    - condition: typed_legacy_backlog
      behavior: block
    - condition: recovery_required
      behavior: diagnose_only
    - condition: manual_escalation
      behavior: escalate
    version_metadata:
      introduced_in: 4.0.0-beta
      deprecated_in: null
    safety_contract:
    - diagnose
    - preflight
    - plan
    - snapshot
    - approve
    - execute
    - verify-postconditions
    - rollback
    verification_commands:
    - python3 scripts/migrate/migrate-v3-to-v4.py preflight --project-dir <project>
  migrate.typed_legacy_backlog:
    title: Typed legacy backlog migration
    supported: true
    delegate_skill: sweetclaude:migrate
    command_entrypoint:
      slash_command: /sweetclaude:migrate
      script: scripts/migrate/migrate_taxonomy.py
      module: migrate.migrate_taxonomy
    supports_project_shapes:
    - typed_legacy_backlog
    - accepted_legacy_taxonomy
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    rollback_support:
      supported: true
      command: python3 scripts/migrate/migrate_taxonomy.py --rollback --project-dir <project>
      limitations: []
    required_preconditions:
    - project shape is typed_legacy_backlog or accepted_legacy_taxonomy
    - no real duplicate ids present
    snapshot_scope_hints:
    - docs/product/
    - .sweetclaude/product/
    postconditions:
    - id: old-prefix-files-removed
      check: no old-prefix files remain on disk
    version_metadata:
      introduced_in: 4.3.0-beta
      deprecated_in: null
    safety_contract:
    - diagnose
    - dry-run
    - snapshot
    - approve
    - execute
    - verify-postconditions
    - rollback
    verification_commands:
    - python3 scripts/migrate/migrate_taxonomy.py --dry-run --project-dir <project>
  recover.graduate_from_compatibility:
    title: Graduate from compatibility mode
    supported: true
    delegate_skill: sweetclaude:recover
    command_entrypoint:
      slash_command: /sweetclaude:doctor
      script: scripts/recovery/recover_project.py
      module: recovery.recover_project
    supports_project_shapes:
    - accepted_legacy_taxonomy
    - typed_legacy_backlog
    - graduation_candidate
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
    - project is in compatibility mode or accepted legacy taxonomy
    - graduation-check passes (v4-compliant)
    snapshot_scope_hints:
    - .sweetclaude/state/sweetclaude.yaml
    postconditions:
    - id: graduation-state-written
      check: recovery.taxonomy.status is graduated and framework.migration_status is complete
    rollback_support:
      supported: true
      command: python3 scripts/recovery/recover_project.py rollback-graduation --project-dir <project>
      limitations: []
    unsupported_states:
    - condition: old_prefix_files_remain
      behavior: block
    - condition: duplicate_ids
      behavior: block
    - condition: frontmatter_parse_errors
      behavior: block
    version_metadata:
      introduced_in: 4.2.6-beta
      deprecated_in: null
    safety_contract:
    - diagnose
    - validate
    - snapshot
    - approve
    - execute
    - verify-postconditions
    - rollback
    verification_commands:
    - python3 scripts/recovery/recover_project.py graduation-check --project-dir <project>
  doctor.compatibility_mode:
    title: Continue in compatibility mode
    supports_project_shapes:
    - accepted_legacy_taxonomy
    mutates_project: false
    requires_approval: false
  doctor.fix_graduation_blockers:
    title: Fix graduation blockers
    supported: true
    delegate_skill: sweetclaude:doctor
    command_entrypoint:
      slash_command: /sweetclaude:doctor
      script: scripts/recovery/recover_project.py
      module: recovery.recover_project
    supports_project_shapes:
    - graduation_blocked
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
    - project is in compatibility mode or accepted legacy taxonomy
    - graduation-check reports validation-failures with resolvable blockers
    snapshot_scope_hints:
    - product work-item files named in each blocker resolution
    postconditions:
    - id: graduation-unblocked
      check: graduation-check reports graduation_allowed true
    rollback_support:
      supported: true
      command: python3 scripts/doctor.py restore --project-dir <project> --archive-dir <archive>
      limitations: []
    version_metadata:
      introduced_in: 4.2.8-beta
      deprecated_in: null
    safety_contract:
    - diagnose
    - validate
    - snapshot
    - approve
    - execute
    - verify-postconditions
    - rollback
    verification_commands:
    - python3 scripts/recovery/recover_project.py graduation-check --project-dir <project>
  doctor.manual_review:
    title: Manual maintenance review
    supports_project_shapes:
    - manual_escalation
    - missing_product_base
    mutates_project: false
    requires_approval: false
  update.framework_sync:
    title: Framework/plugin update without project artifact migration
    supports_project_shapes:
    - current_layout
    - accepted_legacy_taxonomy
    - flat_bl_backlog
    - recovery_required
    - manual_escalation
    - missing_product_base
    mutates_project: false
    mutates_global_config: true
    requires_approval: true
  doctor.scan:
    title: Read-only diagnostic scan across all check categories
    delegate_skill: sweetclaude:doctor
    command_entrypoint:
      slash_command: /sweetclaude:doctor
      script: scripts/doctor.py
      module: null
    supports_project_shapes:
    - current_layout
    - graduation_candidate
    - graduation_blocked
    - accepted_legacy_taxonomy
    mutation_class: read_only
    mutates_project: false
    requires_approval: false
    required_preconditions:
    - sweetclaude.yaml exists
    postconditions:
    - id: scan-emits-findings
      check: scan returns a findings payload without writing to the project
    rollback_support:
      supported: true
      command: "not applicable \u2014 scan writes nothing"
      limitations: []
    unsupported_states:
    - condition: not_configured
      behavior: diagnose_only
    version_metadata:
      introduced_in: 4.0.0
      deprecated_in: null
    verification_commands:
    - python3 scripts/doctor.py scan --project-dir <project>
  doctor.auto_fix:
    title: Apply safe automatic repairs through the archived, reversible pipeline
    delegate_skill: sweetclaude:doctor
    command_entrypoint:
      slash_command: /sweetclaude:doctor
      script: scripts/doctor.py
      module: null
    supports_project_shapes:
    - current_layout
    - graduation_blocked
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
    - scan has run
    - archive created before any write
    snapshot_scope_hints:
    - .sweetclaude/
    postconditions:
    - id: post-fix-rescan
      check: post-fix-rescan reports the addressed findings resolved
    rollback_support:
      supported: true
      command: python3 scripts/doctor.py restore --archive-dir <archive> --all
      limitations: []
    unsupported_states:
    - condition: manual_review
      behavior: escalate
    version_metadata:
      introduced_in: 4.0.0
      deprecated_in: null
    safety_contract:
    - scan
    - plan
    - archive
    - approve
    - execute
    - post-fix-rescan
    - restore
    verification_commands:
    - python3 scripts/doctor.py scan --project-dir <project>
    - python3 scripts/doctor.py dry-run --project-dir <project>
  doctor.restore:
    title: Roll back the file changes a previous doctor run made
    delegate_skill: sweetclaude:doctor
    command_entrypoint:
      slash_command: /sweetclaude:doctor
      script: scripts/doctor.py
      module: null
    supports_project_shapes:
    - current_layout
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
    - an archive directory from a prior doctor run exists
    snapshot_scope_hints:
    - .sweetclaude/
    postconditions:
    - id: restore-verified
      check: restored files match the archived originals
    rollback_support:
      supported: true
      command: re-run doctor auto-fix; each run is separately archived
      limitations:
      - restores only files a doctor run itself changed
    unsupported_states:
    - condition: archive_missing
      behavior: diagnose_only
    version_metadata:
      introduced_in: 4.0.0
      deprecated_in: null
    verification_commands:
    - python3 scripts/doctor.py prune-archives --project-dir <project>
  init.dispatch:
    title: Route a project to the right onboarding, migration, or repair path
    delegate_skill: sweetclaude:init
    command_entrypoint:
      slash_command: /sweetclaude:init
      script: null
      module: null
    supports_project_shapes:
    - current_layout
    - flat_bl_backlog
    - typed_legacy_backlog
    - recovery_required
    mutation_class: read_only
    mutates_project: false
    requires_approval: false
    required_preconditions:
    - plugin install is healthy (preflight.sh reports ok)
    postconditions:
    - id: init-creates-nothing
      check: no files or state written by init itself (ISSUE-249)
    rollback_support:
      supported: true
      command: "not applicable \u2014 init writes nothing"
      limitations: []
    unsupported_states:
    - condition: damaged_state
      behavior: escalate
    - condition: plugin_unhealthy
      behavior: diagnose_only
    version_metadata:
      introduced_in: 4.5.3
      deprecated_in: null
    verification_commands:
    - python3 -m pytest tests/test_skill_contracts.py -q
    - python3 -m pytest tests/test_canonical_state_reads.py -q
  setup.onboard_project:
    title: "Onboard a project \u2014 detect shape, write sweetclaude.yaml, build v4 storage"
    delegate_skill: sweetclaude:setup
    command_entrypoint:
      slash_command: null
      script: scripts/sweetclaude-yaml-template.py
      module: null
    supports_project_shapes:
    - current_layout
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
    - no existing sweetclaude.yaml
    snapshot_scope_hints:
    - .sweetclaude/
    postconditions:
    - id: state-written
      check: sweetclaude.yaml parses and schema_version is known
    - id: storage-built
      check: v4 backlog tree and traceability maps exist
    rollback_support:
      supported: true
      command: /sweetclaude:purge
      limitations:
      - purge removes all SweetClaude artifacts, not just this run's
    unsupported_states:
    - condition: already_configured
      behavior: diagnose_only
    version_metadata:
      introduced_in: 4.0.0
      deprecated_in: null
    verification_commands:
    - python3 scripts/doctor.py scan --project-dir <project>
    - python3 -m pytest tests/test_migrate_to_sweetclaude_yaml.py -q
  purge.remove_all:
    title: Delete every SweetClaude artifact from a project
    delegate_skill: sweetclaude:purge
    command_entrypoint:
      slash_command: /sweetclaude:purge
      script: null
      module: null
    supports_project_shapes:
    - current_layout
    - accepted_legacy_taxonomy
    - flat_bl_backlog
    - typed_legacy_backlog
    mutation_class: destructive
    mutates_project: true
    requires_approval: true
    required_preconditions:
    - typed confirmation from the user
    - backup branch recommended before execution
    snapshot_scope_hints:
    - .sweetclaude/
    - docs/product/
    postconditions:
    - id: artifacts-removed
      check: no .sweetclaude/ directory remains
    rollback_support:
      supported: true
      command: git checkout <backup-branch> -- .sweetclaude/
      limitations:
      - only if the recommended backup branch was created first
      - gitignored content is not recoverable from git alone
    unsupported_states:
    - condition: not_configured
      behavior: diagnose_only
    version_metadata:
      introduced_in: 4.0.0
      deprecated_in: null
    verification_commands:
    - python3 scripts/doctor.py scan --project-dir <project>
  update.check:
    title: Channel-aware check for a newer framework version
    delegate_skill: sweetclaude:update
    command_entrypoint:
      slash_command: /sweetclaude:update
      script: scripts/update.py
      module: null
    supports_project_shapes:
    - current_layout
    mutation_class: read_only
    mutates_project: false
    requires_approval: false
    required_preconditions:
    - network access to the release channel
    postconditions:
    - id: no-prerelease-to-stable
      check: a stable install is never offered a prerelease (ISSUE-248)
    rollback_support:
      supported: true
      command: "not applicable \u2014 check writes nothing to the project"
      limitations: []
    unsupported_states:
    - condition: network_unavailable
      behavior: diagnose_only
    - condition: retired_channel
      behavior: escalate
    version_metadata:
      introduced_in: 4.0.0
      deprecated_in: null
    verification_commands:
    - python3 -m pytest tests/test_update_commands.py -q
    - python3 -m pytest tests/test_beta_channel_retirement.py -q
  work_item_artifacts.backfill:
    title: Backfill per-work-item artifact directories with symlinked artifacts
    delegate_skill: sweetclaude:work-item-artifacts
    command_entrypoint:
      slash_command: /sweetclaude:work-item-artifacts
      script: scripts/backfill_work_item_artifacts.py
      module: null
    supports_project_shapes:
    - current_layout
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
    - dry-run reviewed before execution
    snapshot_scope_hints:
    - .sweetclaude/work/
    postconditions:
    - id: non-destructive
      check: no pre-existing file is replaced and no dangling symlink is left
    rollback_support:
      supported: true
      command: rm -rf .sweetclaude/work/<ITEM-ID>
      limitations: []
    unsupported_states:
    - condition: existing_work_dir
      behavior: diagnose_only
    version_metadata:
      introduced_in: 4.3.0
      deprecated_in: null
    verification_commands:
    - python3 scripts/backfill_work_item_artifacts.py --project-dir <project> --dry-run
    - python3 -m pytest tests/test_backfill_work_item_artifacts.py -q
  product.brief:
