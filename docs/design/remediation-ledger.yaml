# Remediation ledger for 5.1.0. Contract: tests/test_remediation_ledger.py. Source: 2026-10-20 docs audit.
schema_version: 1
decisions:
  progressive_disclosure: Retire progressive disclosure. No runtime reads it, and 5.0 routing (category, then workflow) replaced stage-based visibility. Remove the config block and every claim. Decided 2026-10-20.
  work_types: Keep the 19 work types and 6 shapes only where a phase or hard gate depends on them. Retire claims that /sweetclaude:go classifies requests into work types, shapes or entry categories. Decided 2026-10-20.
  setup_promises: Setup gains a pre-sweetclaude snapshot branch and a mode question (implement). The git init offer, strategy/ folder and deference question are dropped from the docs (retire-claim). Decided 2026-10-20.
  release_split: Phase 0 shipped as 5.0.2. Phases 1-6 ship as 5.1.0, headlined 'enforcement activated across TDD, WIP, sprint and phase policies', only after the live enforcement suite passes. Decided 2026-10-20.
  uncovered_promises: 'Implement all six uncovered promises in 5.1: TDD override logging (R-250), the commit gate requiring failing tests (R-251), CLAUDE.md written by setup (R-034), sprint planning surfacing scope changes (R-180), Flow thin artifacts (R-124) and automatic assumption-register capture (R-178). Decided 2026-10-20.'
